<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    미리보기 정보(og:title·og:description·<title>)를 일부러 두지 않습니다 — 있으면 카카오톡이
    초대 메시지 아래에 'Together 초대' 미리보기 카드를 따로 붙여 말풍선이 두 개가 됩니다.
    탭 제목은 아래 스크립트가 열린 뒤에 붙입니다(카카오톡의 미리보기 수집기는 스크립트를 돌리지 않습니다).
  -->
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg: #fff; --text: #2b2b2b; --mute: #8a8a8a; --line: rgba(43,43,43,.06); --btn: #2b2b2b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161616; --text: #eee; --mute: #9a9a9a; --line: rgba(255,255,255,.06); --btn: #eee; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background-color: var(--bg); color: var(--text);
      background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 16px 16px;
      font: 16px/1.5 -apple-system, "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    main { width: min(420px, 100%); text-align: center; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: var(--mute); font-size: 14px; }
    .open {
      display: block; width: 100%; padding: 16px; border: 0; border-radius: 14px;
      background: var(--btn); color: var(--bg); font: inherit; font-weight: 800; font-size: 17px; text-decoration: none;
    }
    .hint { margin-top: 18px; font-size: 12.5px; }
    .install { display: block; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--mute); color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Together 초대</h1>
    <p id="sub">아래 버튼을 누르면 Together 앱에서 열려요.</p>
    <a class="open" id="open" href="#">Together 앱에서 열기</a>
    <a class="install" href="https://github.com/alsdami/together-invite/releases/download/app/Together.apk">앱이 없나요? Together 설치하기 (안드로이드)</a>
    <p class="hint">
      앱이 열리지 않으면 위에서 최신 버전을 설치한 뒤 이 링크를 다시 눌러 주세요.
    </p>
  </main>
  <script>
    // ?join=list&id=…&code=…&t=제목 → com.checklist.app://invite?join=…
    // 안드로이드는 intent:// 주소로 열어야 카카오톡·크롬 안의 브라우저에서 앱으로 넘어갑니다.
    (function () {
      document.title = 'Together 초대';
      var q = new URLSearchParams(location.search);
      var kind = q.get('join') || '';
      var id = q.get('id') || '';
      var code = q.get('code') || '';
      var title = q.get('t') || '';
      // 짧은 링크 — ?l=<id 22글자> (c 모임 · l 리스트 · r 알림 · h 습관). id 는 uuid 를 base64url 로 줄인 것.
      var SHORT = { c: 'circle', l: 'list', r: 'remind', h: 'habit' };
      for (var k in SHORT) {
        var v = q.get(k);
        if (!v) continue;
        try {
          var bin = atob(v.replace(/-/g, '+').replace(/_/g, '/'));
          var hex = '';
          for (var i = 0; i < bin.length; i++) hex += ('0' + bin.charCodeAt(i).toString(16)).slice(-2);
          if (hex.length === 32) {
            kind = SHORT[k];
            id = hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
          }
        } catch (e) { /* 깨진 링크 — 아래에서 안내합니다 */ }
        break;
      }
      var label = { circle: '모임', list: '리스트', remind: '알림', habit: '습관' }[kind] || '';
      if (!/^(circle|list|remind|habit)$/.test(kind) || !id) {
        document.getElementById('sub').textContent = '초대 정보가 없어요. 받은 메시지를 다시 확인해 주세요.';
        document.getElementById('open').hidden = true;
        return;
      }
      if (title) document.getElementById('title').textContent = '‘' + title + '’ ' + label + ' 초대';
      // 모임 이름(t)도 앱으로 넘겨 확인 창에 '‘시골애들’ 모임에 초대받았어요' 처럼 보여 줍니다.
      var query = 'join=' + encodeURIComponent(kind) + '&id=' + encodeURIComponent(id) +
        (code ? '&code=' + encodeURIComponent(code) : '') + (title ? '&t=' + encodeURIComponent(title) : '');
      var android = /android/i.test(navigator.userAgent);
      var url = android
        ? 'intent://invite?' + query + '#Intent;scheme=com.checklist.app;package=com.checklist.app;end'
        : 'com.checklist.app://invite?' + query;
      var a = document.getElementById('open');
      a.href = url;
      // 바로 열어 보고, 막히면 버튼을 누르면 됩니다 (브라우저마다 누르기 전 자동 이동을 막기도 합니다).
      setTimeout(function () { location.href = url; }, 300);
    })();
  </script>
</body>
</html>
